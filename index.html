<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>dollfacelamb.com</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg-layer bg-apples"></div>
  <div class="bg-layer bg-leopard"></div>
  <div class="bg-layer bg-stars"></div>

  <main class="wrap">
    <header class="topbar">
      <div class="fake-os">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="os-title">dollfacelamb.com</span>
      </div>
    </header>

    <section class="desktop">
      <!-- Left column -->
      <div class="col">
        <article class="window win-profile">
          <div class="titlebar">
            <span class="title">Profile</span>
            <div class="controls">
              <button aria-label="minimize">—</button>
              <button aria-label="maximize">□</button>
              <button aria-label="close">×</button>
            </div>
          </div>
          <div class="content profile">
            <img class="pfp" src="/assets/pfppic.jpg" alt="profile picture" />
            <div class="meta">
              <h1>𝓢𝓪𝓶𝓪𝓷𝓽𝒉𝓪 ༺♰༻</h1>
              <p class="sub"></p>
              <p class="tiny"><span></span></p>
            </div>
          </div>
        </article>

        <article class="window win-about">
          <div class="titlebar">
            <span class="title">All About Me</span>
            <div class="controls">
              <button aria-label="minimize">—</button>
              <button aria-label="maximize">□</button>
              <button aria-label="close">×</button>
            </div>
          </div>
          <div class="content">
            <ul class="favs">
              <li>🍎 color: pink + cream</li>
              <li>⭐ vibe: y2k / myspace / kawaii</li>
              <li>🐆 print: leopard + plaid</li>
              <li>🎀 accessory: bows + stickers</li>
            </ul>
            <div class="stickers">
              <span class="sticker">♡</span>
              <span class="sticker">✿</span>
              <span class="sticker">★</span>
              <span class="sticker">✧</span>
            </div>
          </div>
        </article>
      </div>

      <!-- Right column -->
      <div class="col">
        <article class="window wide win-banner">
          <div class="titlebar">
            <span class="title">Hi there!</span>
            <div class="controls">
              <button aria-label="minimize">—</button>
              <button aria-label="maximize">□</button>
              <button aria-label="close">×</button>
            </div>
          </div>
          <div class="content banner">
            <img src="/assets/welcomebanner.jpg" alt="banner" />
          </div>
        </article>

        <article class="window win-song">
          <div class="titlebar">
            <span class="title">now playing...</span>
            <div class="controls">
              <button aria-label="minimize">—</button>
              <button aria-label="maximize">□</button>
              <button aria-label="close">×</button>
            </div>
          </div>
          <div class="content song">
            <!-- easiest: embed spotify track or playlist -->
            <div class="embed">
              <!-- Replace the src with her spotify embed link if she wants -->
              <iframe
                style="border-radius:12px"
                src="https://open.spotify.com/embed/track/0Z33KFAGut49bYtvHF9TWt?utm_source=generator"
                width="100%" height="152" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            </div>
            <div class="embed">
              <!-- Replace the src with her spotify embed link if she wants -->
              <iframe
                style="border-radius:12px"
                src="https://open.spotify.com/embed/track/4IiXEeH2j5FAVfCncumgXw?utm_source=generator"
                width="100%" height="152" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
            </div>
          </div>
        </article>

        <article class="window win-links">
          <div class="titlebar">
            <span class="title">Links</span>
            <div class="controls">
              <button aria-label="minimize">—</button>
              <button aria-label="maximize">□</button>
              <button aria-label="close">×</button>
            </div>
          </div>
          <div class="content links">
            <a class="linkbtn" href="https://depop.com/dolliesvintagecloset/?utm_source=generic&utm_content=shop&utm_campaign=SHARE_SHOP&utm_medium=share&utm_term=milkks004&_branch_match_id=1548464241869738414&_branch_referrer=H4sIAAAAAAAAA8soKSkottLXT0ktyC%2FQSywo0MvJzMvWdw6vcvRLMbGoMEiyrytKTUstKsrMS49PKsovL04tsnVNSU8FAIxIros6AAAA" target="_blank" rel="noreferrer">
              <img src="/assets/depoplogo.png" alt="Depop" class="icon" /> Depop
              <span class="arrow">↗</span>
            </a>
            <a class="linkbtn" href="https://tiktok.com/@dollfacelamb?_r=1&_t=ZP-93hw4oTUVrj" target="_blank" rel="noreferrer">
              <img src="/assets/tiktoklogo.png" alt="TikTok" class="icon" /> TikTok
              <span class="arrow">↗</span>
            </a>
            <a class="linkbtn" href="https://instagram.com/dollfacelamb?igsh=NTc4MTIwNjQ2YQ%3D%3D" target="_blank" rel="noreferrer">
              <img src="/assets/instalogo.png" alt="Instagram" class="icon" /> Instagram
              <span class="arrow">↗</span>
            </a>
            <a class="linkbtn" href="https://open.spotify.com/user/xo.sammie.xo?si=9d8ded3633e942ea" target="_blank" rel="noreferrer">
              <img src="/assets/spotifylogo.png" alt="Spotify" class="icon" /> Spotify
              <span class="arrow">↗</span>
            </a>
            <a class="linkbtn" href="https://pin.it/3yuKvesML" target="_blank" rel="noreferrer">
              <img src="/assets/pinterestlogo.png" alt="Pinterest" class="icon" /> Pinterest
              <span class="arrow">↗</span>
            </a>
          </div>
        </article>
      </div>
    </section>

    <footer class="footer">
      <span class="tiny muted">made with love from Miles♥</span>
    </footer>
  </main>
</body>
</html>
